<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EG4 Battery Display</title>
<style>
  :root { box-sizing: border-box; --gold:#f2c94c; }
  *, *::before, *::after { box-sizing: inherit; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: #0a0b0f;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 18px;
  }

  /* Outer bezel */
  .device {
    width: min(94vw, calc(78vh * 16 / 9));
    aspect-ratio: 16 / 9;
    background: #050608;
    border-radius: 14px;
    padding: 1.5%;
    box-shadow: 0 0 60px rgba(0,0,0,0.8);
  }

  /* The blue screen */
  .screen {
    width: 100%;
    height: 100%;
    border-radius: 6px;
    background:
      radial-gradient(120% 130% at 50% 0%, #4a53a8 0%, #3f478f 45%, #363c7d 100%);
    position: relative;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 1.15fr 1fr;
    grid-template-rows: auto 1fr;
    padding: 3.2% 3.6%;
    gap: 0 2%;
    color: #ffffff;
    container-type: inline-size;
  }

  /* ---- Header row ---- */
  .logo { grid-column: 1; grid-row: 1; align-self: start; }
  .logo-circle {
    width: 4.6cqw; height: 4.6cqw;
    border: 0.35cqw solid var(--gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--gold);
    font-weight: 800; font-size: 2.1cqw; letter-spacing: -0.5px;
    box-shadow: 0 0 14px rgba(242,201,76,0.55);
    text-shadow: 0 0 8px rgba(242,201,76,0.7);
  }
  .logo-circle span { font-size: 1.5cqw; transform: translateY(0.3cqw); }

  .datetime {
    grid-column: 3; grid-row: 1;
    justify-self: end; align-self: start;
    font-size: 2.5cqw; font-weight: 600; letter-spacing: 0.5px;
    text-shadow: 0 0 6px rgba(255,255,255,0.35);
  }

  /* ---- Columns ---- */
  .col { grid-row: 2; display: flex; flex-direction: column; gap: 3.2cqw; padding-top: 2cqw; }
  .col-left  { grid-column: 1; }
  .col-mid   { grid-column: 2; align-items: center; justify-content: flex-start; gap: 0; }
  .col-right { grid-column: 3; }

  .box {
    border: 0.28cqw solid var(--gold);
    border-radius: 1.6cqw;
    padding: 1.9cqw 2.2cqw;
    display: flex; align-items: center; gap: 2cqw;
    box-shadow: 0 0 10px rgba(242,201,76,0.25);
  }
  .box .label {
    font-size: 3cqw; font-weight: 700;
    text-shadow: 0 0 6px rgba(255,255,255,0.3);
    white-space: nowrap;
  }
  .box svg { flex: none; filter: drop-shadow(0 0 4px rgba(255,255,255,0.35)); }

  .firmware {
    margin-top: 2.6cqw;
    font-size: 3cqw; font-weight: 700; line-height: 1.5; letter-spacing: 0.5px;
    text-shadow: 0 0 6px rgba(255,255,255,0.3);
  }

  .signal { position: relative; }
  .signal .proto { position: absolute; top: -1.9cqw; left: 0; font-size: 1.6cqw; font-weight: 700; }

  /* ---- Center battery ---- */
  .battery-wrap {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; gap: 1cqw;
  }
  .battery-svg { width: 34cqw; height: auto; }
  .battery-pct { font-size: 5.2cqw; font-weight: 700; text-shadow: 0 0 8px rgba(255,255,255,0.4); }

  /* ---- Control panel ---- */
  .controls {
    width: min(94vw, calc(78vh * 16 / 9));
    background: #14161d;
    border: 1px solid #2a2e3a;
    border-radius: 12px;
    padding: 16px 18px;
    color: #e6e8ef;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px 20px;
    font-size: 13px;
  }
  .controls h2 {
    grid-column: 1 / -1; margin: 0 0 2px; font-size: 13px;
    font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #8b90a0;
  }
  .ctl { display: flex; flex-direction: column; gap: 6px; }
  .ctl label { color: #aeb3c2; font-weight: 600; }
  .ctl input[type=number], .ctl input[type=text], .ctl select {
    background: #0c0d12; border: 1px solid #333846; color: #fff;
    border-radius: 7px; padding: 7px 9px; font-size: 13px; width: 100%;
  }
  .ctl input[type=range] { width: 100%; accent-color: var(--gold); }
  .ctl.soc { grid-column: 1 / -1; }
  .soc-row { display: flex; align-items: center; gap: 12px; }
  .soc-row input[type=range] { flex: 1; }
  .soc-val { min-width: 46px; text-align: right; font-weight: 700; color: var(--gold); }
  .chk { display: flex; align-items: center; gap: 8px; }
  .chk input { width: 16px; height: 16px; accent-color: var(--gold); }
</style>
</head>
<body>
  <div class="device">
    <div class="screen">

      <div class="logo"><div class="logo-circle">EG<span>4</span></div></div>
      <div class="datetime" id="datetime">2026-09-21 11:12</div>

      <!-- Left column -->
      <div class="col col-left">
        <div class="box">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>
          </svg>
          <span class="label" id="status">Standby</span>
        </div>

        <div class="box">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
            <path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/>
            <circle cx="12" cy="10" r="2.6"/>
          </svg>
          <span class="label" id="address">1</span>
        </div>

        <div class="box signal">
          <span class="proto">CAN</span>
          <svg width="34" height="30" viewBox="0 0 34 30" fill="#fff">
            <rect x="1" y="20" width="5" height="9" rx="1"/>
            <rect x="10" y="14" width="5" height="15" rx="1"/>
            <rect x="19" y="8" width="5" height="21" rx="1"/>
            <rect x="28" y="2" width="5" height="27" rx="1"/>
          </svg>
          <span class="label">EG4/LUX</span>
        </div>

        <div class="box signal">
          <span class="proto">RS485</span>
          <svg width="34" height="30" viewBox="0 0 34 30" fill="#fff">
            <rect x="1" y="20" width="5" height="9" rx="1"/>
            <rect x="10" y="14" width="5" height="15" rx="1"/>
            <rect x="19" y="8" width="5" height="21" rx="1"/>
            <rect x="28" y="2" width="5" height="27" rx="1"/>
          </svg>
          <span class="label">P01-EG4</span>
        </div>

        <div class="firmware">BMS: Z02T11<br>LCD: V1.3.1</div>
      </div>

      <!-- Center battery -->
      <div class="col col-mid">
        <div class="battery-wrap">
          <svg class="battery-svg" viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg">
            <!-- translucent back walls (full container) -->
            <polygon points="120,28 58,60 58,210 120,178" fill="#9aa1de" opacity="0.30"/>
            <polygon points="120,28 182,60 182,210 120,178" fill="#b3bAe9" opacity="0.22"/>
            <!-- fill block (updated by JS) -->
            <polygon id="fillTop"   fill="#c9f2ff"/>
            <polygon id="fillLeft"  fill="#7fd4ec"/>
            <polygon id="fillRight" fill="#5cc0e0"/>
          </svg>
          <div class="battery-pct" id="pct">19%</div>
        </div>
      </div>

      <!-- Right column -->
      <div class="col col-right">
        <div class="box">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 8 L12 18 L19 8"/><path d="M5 8 Q12 4 19 8"/>
          </svg>
          <span class="label" id="voltage">51.45V</span>
        </div>

        <div class="box">
          <svg width="34" height="30" viewBox="0 0 30 22" fill="none" stroke="#fff" stroke-width="1.8">
            <rect x="1.5" y="4" width="23" height="14" rx="2.5"/>
            <rect x="26" y="8" width="2.6" height="6" rx="1" fill="#fff" stroke="none"/>
            <rect x="4.2" y="7" width="4" height="8" rx="1" fill="#fff" stroke="none"/>
            <rect x="9.4" y="7" width="4" height="8" rx="1" fill="#fff" stroke="none"/>
            <rect x="14.6" y="7" width="4" height="8" rx="1" fill="#fff" stroke="none"/>
          </svg>
          <span class="label" id="capacity">280Ah</span>
        </div>

        <div class="box">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 15 A9 9 0 0 1 20 15"/>
            <path d="M8.5 19 L12 9 L15.5 19 M9.7 15.5 h4.6"/>
          </svg>
          <span class="label" id="current">0.00A</span>
        </div>

        <div class="box">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6">
            <circle cx="12" cy="12" r="3.2"/>
            <path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/>
          </svg>
          <span class="label">Settings</span>
        </div>
      </div>

    </div>
  </div>

  <!-- ================= CONTROL PANEL ================= -->
  <div class="controls">
    <h2>Live Controls</h2>

    <div class="ctl soc">
      <label for="socRange">State of charge</label>
      <div class="soc-row">
        <input type="range" id="socRange" min="0" max="100" value="19">
        <span class="soc-val" id="socVal">19%</span>
      </div>
    </div>

    <div class="ctl">
      <label for="statusSel">Status</label>
      <select id="statusSel">
        <option>Standby</option>
        <option>Charging</option>
        <option>Discharging</option>
        <option>Fault</option>
      </select>
    </div>

    <div class="ctl">
      <label for="voltInput">Voltage (V)</label>
      <input type="number" id="voltInput" step="0.01" value="51.45">
    </div>

    <div class="ctl">
      <label for="curInput">Current (A)</label>
      <input type="number" id="curInput" step="0.01" value="0.00">
    </div>

    <div class="ctl">
      <label for="capInput">Capacity (Ah)</label>
      <input type="number" id="capInput" step="1" value="280">
    </div>

    <div class="ctl">
      <label for="addrInput">Address</label>
      <input type="number" id="addrInput" step="1" value="1">
    </div>

    <div class="ctl">
      <label>Clock</label>
      <div class="chk">
        <input type="checkbox" id="liveClock" checked>
        <label for="liveClock" style="font-weight:500;color:#e6e8ef;">Live (real time)</label>
      </div>
    </div>
  </div>

<script>
  // ---- 3D fill geometry ----
  // Isometric open box: opening centered at y=60, floor at y=210, height=150.
  const CX = 120, HALF_W = 62, HALF_H = 32;
  const OPEN_Y = 60, FLOOR_Y = 210, FULL_H = FLOOR_Y - OPEN_Y; // 150

  function pts(arr){ return arr.map(p => p[0] + ',' + p[1]).join(' '); }

  function drawFill(pct){
    const p = Math.max(0, Math.min(100, pct)) / 100;
    const yc = FLOOR_Y - p * FULL_H;          // top-face center y of the fill
    const frontFloor = FLOOR_Y + HALF_H;      // 242
    // top face (diamond)
    document.getElementById('fillTop').setAttribute('points', pts([
      [CX, yc - HALF_H], [CX - HALF_W, yc], [CX, yc + HALF_H], [CX + HALF_W, yc]
    ]));
    // left visible face
    document.getElementById('fillLeft').setAttribute('points', pts([
      [CX - HALF_W, yc], [CX, yc + HALF_H], [CX, frontFloor], [CX - HALF_W, FLOOR_Y]
    ]));
    // right visible face
    document.getElementById('fillRight').setAttribute('points', pts([
      [CX + HALF_W, yc], [CX, yc + HALF_H], [CX, frontFloor], [CX + HALF_W, FLOOR_Y]
    ]));
  }

  // ---- bindings ----
  const socRange = document.getElementById('socRange');
  const socVal   = document.getElementById('socVal');
  const pctText  = document.getElementById('pct');

  function updateSOC(){
    const v = Math.round(socRange.value);
    socVal.textContent = v + '%';
    pctText.textContent = v + '%';
    drawFill(v);
  }
  socRange.addEventListener('input', updateSOC);

  document.getElementById('statusSel').addEventListener('change', e => {
    document.getElementById('status').textContent = e.target.value;
  });
  document.getElementById('voltInput').addEventListener('input', e => {
    const n = parseFloat(e.target.value);
    document.getElementById('voltage').textContent = (isNaN(n)?0:n).toFixed(2) + 'V';
  });
  document.getElementById('curInput').addEventListener('input', e => {
    const n = parseFloat(e.target.value);
    document.getElementById('current').textContent = (isNaN(n)?0:n).toFixed(2) + 'A';
  });
  document.getElementById('capInput').addEventListener('input', e => {
    const n = parseInt(e.target.value);
    document.getElementById('capacity').textContent = (isNaN(n)?0:n) + 'Ah';
  });
  document.getElementById('addrInput').addEventListener('input', e => {
    document.getElementById('address').textContent = e.target.value || '1';
  });

  // ---- clock ----
  const dtEl = document.getElementById('datetime');
  const liveClock = document.getElementById('liveClock');
  function pad(n){ return String(n).padStart(2,'0'); }
  function tick(){
    if(!liveClock.checked) return;
    const d = new Date();
    dtEl.textContent = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate())
                     + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  liveClock.addEventListener('change', () => {
    if(liveClock.checked) tick();
    else dtEl.textContent = '2026-09-21 11:12';
  });
  setInterval(tick, 1000);

  // init
  updateSOC();
  tick();
</script>
</body>
</html>
